<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="はじめての特殊清掃">
  <title>はじめての特殊清掃</title>
  <!-- 部屋：角がひとつ（右上）開いた四角 -->
